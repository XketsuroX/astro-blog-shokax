server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 核心：找不到檔案時，導向 Astro 生成的 404.html，並嚴格保持 404 狀態碼
    error_page 404 /404.html;

    location / {
        # 優先找實體檔案 -> 再找目錄 -> 導向 index (適合 SPA 或靜態網站)
        try_files $uri $uri/ /index.html;
    }
}