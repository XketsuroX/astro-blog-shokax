name: Build and Push Astro to GHCR

on:
  push:
    branches: ["main"] # 只有 main 分支更新時觸發
  workflow_dispatch:   # 允許手動觸發測試

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # 格式為 username/repo-name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # 確保你的主題或內容子模組也被拉下來

      # 設置 Docker Buildx 以提升構建速度與支持緩存
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登入 GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成 Docker Tag (例如 latest 與 commit SHA)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # 執行編譯與推送
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          cache-from: type=gha # 使用 GitHub Actions 內置緩存
          cache-to: type=gha,mode=max
